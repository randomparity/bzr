# Standalone (non-member) workspace: cargo-fuzz builds this crate with
# nightly + sanitizers via its own toolchain, so it must not share the
# parent workspace's resolver or lockfile. The empty `[workspace]` table
# stops cargo's parent-workspace auto-discovery.
[workspace]

[package]
name = "bzr-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
toml = "0.8"

[dependencies.bzr]
path = ".."
default-features = false

[[bin]]
name = "fuzz_xmlrpc_parse"
path = "fuzz_targets/fuzz_xmlrpc_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_url_parser"
path = "fuzz_targets/fuzz_url_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_flag_parser"
path = "fuzz_targets/fuzz_flag_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tls_der"
path = "fuzz_targets/fuzz_tls_der.rs"
test = false
doc = false
bench = false
