[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Internal build helpers for bzr (manpage generation, etc.)"
license = "MIT"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
bzr = { path = "..", default-features = false }
clap = { version = ">=4.5.60, <4.7", features = ["derive"] }
clap_mangen = "0.3"
anyhow = "1"
