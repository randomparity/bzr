version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      # The direct dependency can move to base64 0.23 only by adding a second
      # version: reqwest, wiremock, and rcgen still require base64 0.22.
      # Revisit when those upstream crates support 0.23.
      - dependency-name: "base64"
        versions: ["0.23.x"]

      # `dbus-secret-service` (keyring default feature) pins sha2 0.10.x as a
      # transitive dep, so bumping the direct dep to 0.11.x cannot collapse to
      # a single version — it only adds a duplicate crypto stack
      # (sha2/digest/crypto-common/block-buffer/cpufeatures all doubled).
      # Revisit when the keyring chain moves to digest 0.11.  See #207, #184.
      - dependency-name: "sha2"
        versions: ["0.11.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    ignore:
      # fuzz.yml pins dtolnay/rust-toolchain to a `master` SHA so the action
      # honors its `toolchain: nightly-...` input. Dependabot repeatedly
      # collapses that pin onto a stable-channel branch SHA (e.g. `1.89`),
      # silently breaking Fuzz CI. Bump this pin by hand instead. See #207.
      - dependency-name: "dtolnay/rust-toolchain"
