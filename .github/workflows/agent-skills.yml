name: agent-skills

on:
  push:
    paths:
      - "agent-skills/**"
      - "src/**"
      - "docs/bzr-cli.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/agent-skills.yml"
  pull_request:
    paths:
      - "agent-skills/**"
      - "src/**"
      - "docs/bzr-cli.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/agent-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install tooling
        # libdbus-1-dev + pkg-config are required to build with default features
        # (the keyring backend links libdbus on Linux). Per CLAUDE.md, the build
        # environment is made correct rather than dodging the dep by disabling
        # default features, so the drift check validates the surface users run.
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y shellcheck libdbus-1-dev pkg-config
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Assert pwsh is present
        run: command -v pwsh
      - name: Build bzr
        # Default features (keyring on) match the shipped binary, so the drift
        # check inspects the command surface users actually have. --locked pins
        # the dependency set per repo convention.
        run: cargo build --locked
      - name: Run agent-skills checks
        run: BZR_BIN="$PWD/target/debug/bzr" sh agent-skills/tests/run.sh
