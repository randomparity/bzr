name: Dependency Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency policy
        run: cargo deny check

      # fuzz/ is excluded from the root workspace and has its own lockfile, so
      # root pin changes leave fuzz/Cargo.lock stale unless it is refreshed.
      - name: Check fuzz lockfile is in sync
        run: |
          if ! cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null; then
            echo "::error::fuzz/Cargo.lock is out of sync with the root dependency pins. Fix: cd fuzz && cargo update -p <crate> for each crate named above (not a blanket cargo update)."
            exit 1
          fi

      # --allow unmatched-skip: root skip entries (e.g. keyring/dbus) do not
      # all appear in the fuzz graph; see the fuzz-lock-sync design spec.
      - name: Check fuzz dependency policy
        run: cargo deny --manifest-path fuzz/Cargo.toml check --allow unmatched-skip
