name: Functional Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  all-bugzilla-versions:
    name: Bugzilla bz50/bz52/bz53
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # libdbus-1-dev/pkg-config: keyring default feature.
          # python3/openssl: the ad-hoc TLS phase (02c-tls-inline) HTTPS fixture;
          # absent them the phase skips, but install so the scheduled run exercises it.
          sudo apt-get install -y libdbus-1-dev pkg-config python3 openssl

      - uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: functional-tests

      - name: Build bzr once
        run: cargo build --release --locked

      - name: Run real Bugzilla functional tests
        env:
          BZR_BIN: ${{ github.workspace }}/target/release/bzr
        run: tests/functional/run-all-versions.sh

      - name: Stop Bugzilla containers
        if: always()
        run: |
          set -euo pipefail
          for version in bz50 bz52 bz53; do
            BZR_BZ_VERSION="$version" tests/functional/setup-bugzilla.sh stop || true
          done
